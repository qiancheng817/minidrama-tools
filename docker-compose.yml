services:
  ai-drama-manager:
    build: .
    container_name: ai-drama-manager
    restart: unless-stopped
    ports:
      - "8097:8096"
    environment:
      SOURCE_ROOT: /source
      LIBRARY_ROOT: /library
      BROWSE_ROOTS: /source,/library,/disks/local,/disks/cd2
      CONFIG_DIR: /config
      # 示例：http://NAS-IP:8096；如果暂不联动 Emby，可以留空。
      EMBY_URL: ""
      EMBY_API_KEY: ""
      TZ: Asia/Shanghai
    volumes:
      - "${SCRAPE_DIR:-/path/to/your/short-dramas}:/source"
      - "${ORGANIZE_DIR:-/path/to/your/media}:/library"
      - "${LOCAL_DISK_ROOT:-/path/to/your/local-disk}:/disks/local"
      - "${CD2_MOUNT_DIR:-/path/to/your/cd2-mount}:/disks/cd2"
      - "./config:/config"
